name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check-version:
    name: Verify tag matches pubspec version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Extract pubspec version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//; s/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pubspec version: $VERSION, tag: ${GITHUB_REF_NAME}"

      - name: Check tag ↔ pubspec sync
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version $VERSION."
            echo "Update pubspec.yaml 'version:' (or re-tag) so they match."
            exit 1
          fi

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/Filmify-${{ needs.check-version.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*

  build-linux:
    name: Linux build
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Stage artifact
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p "dist/Filmify-$VERSION-linux-x64"
          cp -r build/linux/x64/release/bundle/. "dist/Filmify-$VERSION-linux-x64/"
          tar -czf "dist/Filmify-$VERSION-linux-x64.tar.gz" -C dist "Filmify-$VERSION-linux-x64"
          rm -rf "dist/Filmify-$VERSION-linux-x64"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*

  build-windows:
    name: Windows build
    runs-on: windows-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Stage artifact
        shell: pwsh
        run: |
          $version = "${{ needs.check-version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force build/windows/x64/runner/Release/* "dist/"
          Compress-Archive -Path dist/* -DestinationPath "Filmify-$version-windows-x64.zip" -Force
          Remove-Item -Recurse -Force dist
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item "Filmify-$version-windows-x64.zip" "dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [check-version, build-android, build-linux, build-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Filmify ${{ needs.check-version.outputs.version }}
          files: dist/*
          generate_release_notes: true
