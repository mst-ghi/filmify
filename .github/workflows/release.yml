name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check-version:
    name: Verify tag matches pubspec version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Extract pubspec version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//; s/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pubspec version: $VERSION, tag: ${GITHUB_REF_NAME}"

      - name: Check tag ↔ pubspec sync
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version $VERSION."
            echo "Update pubspec.yaml 'version:' (or re-tag) so they match."
            exit 1
          fi

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/Filmify-${{ needs.check-version.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*

  build-linux:
    name: Linux build
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev liblzma-dev ninja-build

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Install fpm
        run: sudo gem install fpm --no-document

      - name: Package deb and rpm
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p dist
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/opt/filmify" \
                   "$STAGE/usr/share/applications" \
                   "$STAGE/usr/share/icons/hicolor/512x512/apps"
          cp -r build/linux/x64/release/bundle/. "$STAGE/opt/filmify/"
          cp packaging/linux/filmify.desktop "$STAGE/usr/share/applications/"
          cp assets/branding/linux/filmify-512.png \
             "$STAGE/usr/share/icons/hicolor/512x512/apps/filmify.png"

          fpm -s dir -t deb -n filmify -v "$VERSION" -a amd64 \
            --description "Bilingual movie discovery & download hub" \
            --url "https://github.com/mst-ghi/filmify" \
            --maintainer "mst-ghi" \
            --category video \
            --depends "libgtk-3-0" \
            --depends "libstdc++6" \
            -C "$STAGE" \
            -p "dist/Filmify-$VERSION-linux-amd64.deb" .

          fpm -s dir -t rpm -n filmify -v "$VERSION" -a x86_64 \
            --description "Bilingual movie discovery & download hub" \
            --url "https://github.com/mst-ghi/filmify" \
            --maintainer "mst-ghi" \
            --depends "gtk3" \
            --depends "libstdc++" \
            -C "$STAGE" \
            -p "dist/Filmify-$VERSION-linux-x86_64.rpm" .

          rm -rf "$STAGE"

      - name: Stage portable tar.gz
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p dist "dist/Filmify-$VERSION-linux-x64"
          cp -r build/linux/x64/release/bundle/. "dist/Filmify-$VERSION-linux-x64/"
          tar -czf "dist/Filmify-$VERSION-linux-x64.tar.gz" -C dist "Filmify-$VERSION-linux-x64"
          rm -rf "dist/Filmify-$VERSION-linux-x64"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*

  build-windows:
    name: Windows build
    runs-on: windows-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc "/DAppVersion=${{ needs.check-version.outputs.version }}" "packaging\windows\filmify.iss"

      - name: Stage portable zip
        shell: pwsh
        run: |
          $version = "${{ needs.check-version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Recurse -Force build/windows/x64/runner/Release/* "stage/"
          Compress-Archive -Path stage/* -DestinationPath "dist/Filmify-$version-windows-x64.zip" -Force
          Remove-Item -Recurse -Force stage

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [check-version, build-android, build-linux, build-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Filmify ${{ needs.check-version.outputs.version }}
          files: dist/*
          generate_release_notes: true
